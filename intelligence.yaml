# Gmail Sentry — v2 manifest.
#
# Single source of truth for the runtime primitives: integrations, tools,
# agents, workflows, triggers. Decorators in backend/{agents,tools}/ bind a
# Python symbol to an entry by id.

schemaVersion: 1
id: gmail-sentry
version: 1.0.0

catalog: []

# Built-in catalog integrations. The Claritty platform owns connecting these
# (OAuth on the app's Intelligence / Settings → Integrations tabs); the app
# declares them here and calls their tools. No API keys, no OAuth code.
integrations:
  - id: gmail
  - id: slack
  - id: telegram
  - id: discord
  - id: twilio

tools:
  - id: app.run_inbox_scan
    handler: backend.tools.sentry_tools:run_inbox_scan
    input:
      user_id: { type: string, required: false }
    output:
      ok: { type: boolean, required: false }
      scanned: { type: number, required: false }
      flagged: { type: number, required: false }
      labeled: { type: number, required: false }
      notified: { type: number, required: false }
      slack_configured: { type: boolean, required: false }
      promo_count: { type: number, required: false }
      social_count: { type: number, required: false }
      spam_count: { type: number, required: false }
      error: { type: string, required: false }

  - id: app.send_digest
    handler: backend.tools.sentry_tools:send_digest
    input:
      user_id: { type: string, required: false }
    output:
      ok: { type: boolean, required: false }
      sent: { type: boolean, required: false }
      reason: { type: string, required: false }
      error: { type: string, required: false }

agents:
  - id: triage-agent
    source: custom
    handler: backend.agents.triage_agent:TriageAgent
    description: |
      Gmail Sentry's inbox watchdog. Each run it scans recent inbox mail, files
      messages by the user's label rules, classifies each into urgent /
      needs_reply / fyi (fusing natural-language rules, VIP senders, keywords,
      and deadline/action detection), records alerts, and Slack-pings the user
      about the ones that need attention — with a deep link to the email.
    model: claude-sonnet-4-6
    reasoning: standard
    integrations: [gmail, slack, telegram, discord, twilio]
    # app.run_inbox_scan orchestrates a full scan; the gmail.*/slack.* catalog
    # tools are the concrete integration capabilities it exercises (read inbox,
    # label mail, post the Slack alert) — declared so the platform sees the
    # Gmail + Slack integrations as actually used.
    tools:
      - app.run_inbox_scan
      - gmail.list_messages
      - gmail.search
      - gmail.add_label
      - gmail.send
      - slack.post_message
      - slack.list_channels
      - telegram.send_message
      - discord.send_message
      - twilio.send_whatsapp
    input:
      user_id: { type: string, required: true }
    output:
      summary: { type: string, required: true }
    timeout: 120

  - id: digest-agent
    source: custom
    handler: backend.agents.digest_agent:DigestAgent
    description: |
      Gmail Sentry's daily reporter. Gathers the user's still-open alerts, groups
      them into urgent / to-reply (each to-reply item carries a one-tap approve
      link to the drafted reply), and sends a single report to every channel the
      user configured. Sends nothing when the inbox is calm.
    model: claude-sonnet-4-6
    reasoning: standard
    integrations: [slack, telegram, discord, twilio]
    tools:
      - app.send_digest
      - slack.post_message
      - telegram.send_message
      - discord.send_message
      - twilio.send_whatsapp
    input:
      user_id: { type: string, required: true }
    output:
      summary: { type: string, required: true }
    timeout: 120

workflows:
  - id: scan-inbox
    inputs:
      user_id: { type: string, required: true }
    steps:
      - id: scan
        agent: triage-agent
        input:
          user_id: "${input.user_id}"
    outputs:
      summary: "${steps.scan.output.summary}"

  - id: send-digest
    inputs:
      user_id: { type: string, required: true }
    steps:
      - id: digest
        agent: digest-agent
        input:
          user_id: "${input.user_id}"
    outputs:
      summary: "${steps.digest.output.summary}"

triggers:
  - id: sentry-scan
    type: SCHEDULE
    workflow: scan-inbox
    name: Sentry inbox scan
    description: Scan the inbox on an interval and alert on urgent mail.
    supportedSchedules: [INTERVAL]
    maxInstancesPerUser: 1
    configFields:
      - { key: interval_minutes, type: number, required: true, label: "Scan every (minutes)", default: 5 }
      - { key: timezone, type: timezone, required: true, label: "Timezone" }

  - id: sentry-digest
    type: SCHEDULE
    workflow: send-digest
    name: Daily inbox report
    description: Send a grouped report of what needs attention + replies waiting.
    supportedSchedules: [DAILY]
    maxInstancesPerUser: 2
    configFields:
      - { key: time, type: time, required: true, label: "Send at", default: "08:00" }
      - { key: timezone, type: timezone, required: true, label: "Timezone" }
