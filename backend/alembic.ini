# Alembic config for the app's database migrations.
# Schema changes (e.g. adding a column to a model) MUST go through a migration so
# existing data is preserved — `create_all` only creates missing tables, it never
# ALTERs them. Workflow:
#   alembic -c backend/alembic.ini revision --autogenerate -m "add due_date"
#   alembic -c backend/alembic.ini upgrade head
# The app also runs `upgrade head` automatically on startup (see database.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# The DB URL is read from the DATABASE_URL env var in migrations/env.py
# (do NOT hardcode it here).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
