name: catalog-eval

# Runs the catalog's agent eval suite on every PR touching catalog
# entries + nightly on the default branch. The audit's "every prompt
# edit is a coin flip" failure mode is what this guards against.

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
  pull_request:
    paths:
      - "catalog/**"
  schedule:
    # 06:00 UTC every day — well before US business hours so a
    # regression surfaces in time for someone to fix it.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Claritty SDK
        # Pulls from the same PyPI version the seed runs in production
        # so a published-SDK regression also surfaces here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "claritty-sdk>=2.0,<3.0"
      - name: Run catalog evals
        env:
          # CI is stub-mode: no LLM key, no spend. The llm.stub_responses
          # block in each case drives the agent's tool-use loop
          # deterministically.
          CLARITTY_CATALOG_ROOT: ${{ github.workspace }}/catalog
        run: |
          claritty-eval --catalog-root catalog --bail
