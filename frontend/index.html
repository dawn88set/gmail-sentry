<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="__APP_DESCRIPTION__" />
    <meta property="og:title" content="__APP_NAME__" />
    <meta property="og:description" content="__APP_DESCRIPTION__" />
    <title>__APP_NAME__</title>
    <script>
      // Apply the inherited theme before first paint to avoid a flash. The
      // platform passes ?theme=dark|light when embedding; standalone we follow
      // the OS. useClarittyTheme() then takes over (live postMessage updates).
      (function () {
        try {
          var t = new URLSearchParams(location.search).get('theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
