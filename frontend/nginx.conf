server {
    listen 3200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ⚠️ CRITICAL: Proxy API requests to backend service
    # This location block is REQUIRED for monolithic container architecture
    # Frontend makes relative API calls like /api/widget which are proxied to localhost:8000
    # Note: In monolithic container, backend runs on localhost:8000 via supervisord
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NOTE: do NOT add an `if ($request_method = OPTIONS)` block here.
        # An `if` inside a `location` that uses `proxy_pass` makes nginx DROP
        # the request body for POST/PUT (the infamous "if is evil" bug) — which
        # surfaced as FastAPI 422 "Field required (body)" on POST /api/.../execute
        # while GETs worked. CORS + OPTIONS preflight are handled by FastAPI's
        # CORSMiddleware (see backend/main.py), and Claritty apps are same-origin
        # in the platform iframe anyway, so no nginx-level CORS is needed.
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # 🔧 CACHE FIX: Prevent HTML caching (critical for iframes)
        # Ensures platform iframes always fetch latest version after deployments
        # Static assets (.js, .css) still get long-term caching via regex location block below
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
